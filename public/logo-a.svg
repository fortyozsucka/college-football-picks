<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark squircle badge background -->
  <rect width="48" height="48" rx="12" fill="#0b0f0b"/>
  <!-- Subtle top-left highlight for depth -->
  <rect width="48" height="48" rx="12" fill="url(#sheen)" opacity="0.08"/>
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="white"/>
      <stop offset="40%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Bold S stroke: upper arc (right→left), cross diagonal, lower arc (right→left) -->
  <path d="M33,13 C33,7 14,7 14,18 C14,24 33,24 33,30 C33,41 14,41 14,35"
        stroke="#6ade9c" stroke-width="4.5" stroke-linecap="round" fill="none"/>
</svg>
